<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Packages | LabRunr</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. DESIGN SYSTEM (Premium White-Dominant)
        ========================================= */
        :root {
            --white: #ffffff;
            --bg-body: #fbfdfc; 
            --bg-surface: #ffffff;
            --bg-light-mint: #eef7f5;
            
            --teal-primary: #1a6f61;
            --teal-hover: #135248;
            --mint-accent: #5bc2a8;
            
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            
            --success: #059669;
            --success-bg: #d1fae5;
            --warning: #d97706;
            
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -3px rgba(26, 111, 97, 0.1);
            
            --font-head: 'Fraunces', serif;
            --font-body: 'Inter', sans-serif;
            
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --container-max: 1320px;
        }

        /* =========================================
           2. RESET & BASE
        ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--text-body); background-color: var(--bg-body); line-height: 1.6; -webkit-font-smoothing: antialiased; padding-top: 80px; }
        a { text-decoration: none; color: inherit; transition: all 0.2s; }
        ul { list-style: none; }
        h1, h2, h3, h4 { font-family: var(--font-head); color: var(--text-heading); font-weight: 700; line-height: 1.2; }

        .container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 24px; }
        @media (max-width: 640px) { .container { padding: 0 16px; } }

        /* Navigation */
        .nav-header { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); padding: 16px 0; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: var(--font-head); font-weight: 900; font-size: 1.5rem; color: var(--teal-primary); display: flex; align-items: center; gap: 10px; }
        .logo svg { width: 28px; height: 28px; color: var(--mint-accent); }
        .nav-links { display: flex; gap: 32px; align-items: center; font-weight: 500; }
        .nav-links a.link-item:hover { color: var(--teal-primary); }
        .btn-primary { background: var(--teal-primary); color: var(--white); padding: 12px 24px; border-radius: var(--radius-full); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; transition: 0.2s;}
        .btn-primary:hover { background: var(--teal-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }

        @media (max-width: 860px) { .nav-links .hide-mobile { display: none; } }

        /* =========================================
           3. TOAST NOTIFICATIONS (UTILS)
        ========================================= */
        .toast { position: fixed; bottom: 32px; right: 32px; z-index: 1000; background: var(--bg-surface); border-left: 4px solid var(--success); box-shadow: var(--shadow-lg); padding: 16px 24px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; font-weight: 500; animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .toast-icon { color: var(--success); display: flex; align-items: center; }

        /* =========================================
           4. PACKAGES PAGE LAYOUT
        ========================================= */
        .page-header { padding: 48px 0 32px; border-bottom: 1px solid var(--border-light); background: var(--bg-surface); margin-bottom: 32px;}
        .page-header h1 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 16px; }
        .page-header p { font-size: 1.125rem; color: var(--text-muted); max-width: 600px; }

        /* Pill Tabs Filter */
        .filter-tabs { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px; margin-bottom: 32px; scrollbar-width: none; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: var(--bg-surface); border: 1px solid var(--border-light); color: var(--text-body); padding: 10px 20px; border-radius: var(--radius-full); font-size: 0.95rem; font-weight: 500; font-family: var(--font-body); cursor: pointer; white-space: nowrap; transition: all 0.2s; box-shadow: var(--shadow-sm); }
        .tab-btn:hover { border-color: var(--teal-primary); color: var(--teal-primary); transform: translateY(-1px); }
        .tab-btn.active { background: var(--teal-primary); color: var(--white); border-color: var(--teal-primary); box-shadow: var(--shadow-md); font-weight: 600;}

        /* Package Grid */
        .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 32px; padding-bottom: 96px; }
        
        /* Package Card */
        .pkg-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); padding: 32px 24px; display: flex; flex-direction: column; transition: all 0.3s; position: relative; overflow: hidden; box-shadow: var(--shadow-sm); }
        .pkg-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--bg-light-mint); }
        
        .pkg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .save-badge { background: var(--success-bg); color: var(--success); padding: 6px 12px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 4px;}
        .save-badge svg { width: 14px; height: 14px; }
        
        .pkg-card h3 { font-size: 1.5rem; margin-bottom: 12px; line-height: 1.3; }
        .pkg-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; flex-grow: 1; }
        
        .test-count { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--teal-primary); font-weight: 600; margin-bottom: 24px; background: var(--bg-light-mint); padding: 8px 12px; border-radius: var(--radius-md); width: fit-content;}
        
        .pkg-footer { border-top: 1px solid var(--border-light); padding-top: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
        .price-block { display: flex; flex-direction: column; }
        .sum-price { font-size: 0.9rem; color: var(--text-muted); text-decoration: line-through; font-weight: 500; margin-bottom: 2px;}
        .final-price { font-family: var(--font-head); font-weight: 900; font-size: 1.75rem; color: var(--text-heading); line-height: 1; }
        
        .book-btn { background: var(--teal-primary); color: white; border: none; padding: 12px 20px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .book-btn:hover { background: var(--teal-hover); }
        .book-btn.added { background: var(--success); }

        /* Empty State */
        .empty-state { text-align: center; padding: 80px 24px; background: var(--bg-surface); border: 1px dashed var(--border-light); border-radius: var(--radius-lg); display: none; margin-bottom: 96px;}
        .empty-state svg { width: 48px; height: 48px; color: var(--border-light); margin-bottom: 16px; }
        .empty-state h3 { font-size: 1.25rem; margin-bottom: 8px; }
        .empty-state p { color: var(--text-muted); margin-bottom: 24px; }
    </style>
</head>
<body>

    <header class="nav-header" id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4zm-7 18c0-4.42 3.58-8 8-8s8 3.58 8 8H5z"/></svg>
                <span>LabRunr</span>
            </a>
            <nav class="nav-links">
                <a href="tests.html" class="link-item hide-mobile">Tests</a>
                <a href="packages.html" class="link-item hide-mobile" style="color: var(--teal-primary); font-weight: 600;">Packages</a>
                <a href="auth-login.html" class="link-item">Sign In</a>
                
                <a href="book.html" class="btn-primary" id="navCartBtn" style="padding: 10px 20px; font-size: 0.95rem;">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span id="cartCount">Cart (0)</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>Health Packages</h1>
            <p>Bundled diagnostic tests curated by medical professionals. Save money compared to individual testing while gaining a comprehensive view of your health.</p>
        </div>
    </div>

    <main class="container">
        
        <div class="filter-tabs" id="filterTabs">
            <button class="tab-btn active" data-goal="all">All Packages</button>
            <button class="tab-btn" data-goal="wellness">General Wellness</button>
            <button class="tab-btn" data-goal="womens">Women's Health</button>
            <button class="tab-btn" data-goal="mens">Men's Health</button>
            <button class="tab-btn" data-goal="chronic">Chronic Management</button>
            <button class="tab-btn" data-goal="seniors">Senior Care</button>
            <button class="tab-btn" data-goal="sexual">Sexual Health</button>
        </div>

        <div class="packages-grid" id="packagesGrid">
            </div>

        <div class="empty-state" id="emptyState">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
            <h3>No packages found</h3>
            <p>We couldn't find any packages matching this specific health goal.</p>
            <button class="btn-primary" onclick="resetFilters()" style="border-radius: var(--radius-md);">View All Packages</button>
        </div>

    </main>

    <script>
        /* =========================================
           DATA & STATE
        ========================================= */

        // 1. Hardcoded Dataset (15 Packages)
        const packagesData = [
            { code: 'PKG-001', name: 'Annual Wellness Premium', goal: 'wellness', testCount: 12, individual_sum: 67500, package_price: 45000, desc: 'Comprehensive full-body checkup covering liver, kidney, heart, thyroid, and blood health.' },
            { code: 'PKG-002', name: 'Basic Health Screen', goal: 'wellness', testCount: 5, individual_sum: 25000, package_price: 19500, desc: 'The essential baseline covering Full Blood Count, Malaria, Typhoid, and Urinalysis.' },
            { code: 'PKG-003', name: 'Executive Men\'s Check', goal: 'mens', testCount: 10, individual_sum: 80000, package_price: 65000, desc: 'Advanced cardiovascular risk assessment, prostate screening (PSA), testosterone, and metabolic analysis.' },
            { code: 'PKG-004', name: 'Comprehensive Women\'s', goal: 'womens', testCount: 11, individual_sum: 85000, package_price: 68000, desc: 'Hormone panel, thyroid function, iron profile, and vital metabolic markers tailored for women.' },
            { code: 'PKG-005', name: 'Diabetes Management', goal: 'chronic', testCount: 6, individual_sum: 32500, package_price: 24000, desc: 'Essential quarterly monitoring including HbA1c, Fasting Blood Sugar, and Kidney Function analysis.' },
            { code: 'PKG-006', name: 'Heart Health Profile', goal: 'chronic', testCount: 7, individual_sum: 45000, package_price: 34500, desc: 'Deep look into cardiovascular risk via Lipid Profile, hs-CRP, and essential electrolytes.' },
            { code: 'PKG-007', name: 'Senior Care (60+)', goal: 'seniors', testCount: 14, individual_sum: 95000, package_price: 72000, desc: 'Tailored for older adults, focusing on bone health, arthritis markers, kidney function, and blood sugar.' },
            { code: 'PKG-008', name: 'PCOS Evaluation', goal: 'womens', testCount: 8, individual_sum: 62000, package_price: 49500, desc: 'Specific hormonal and metabolic markers used to diagnose and monitor Polycystic Ovary Syndrome.' },
            { code: 'PKG-009', name: 'Fertility Baseline (Female)', goal: 'womens', testCount: 6, individual_sum: 75000, package_price: 58000, desc: 'Day 3 & Day 21 hormonal mapping including FSH, LH, Prolactin, and Progesterone.' },
            { code: 'PKG-010', name: 'Fertility Baseline (Male)', goal: 'mens', testCount: 5, individual_sum: 55000, package_price: 42000, desc: 'Hormonal evaluation including Total Testosterone, FSH, LH, and Prolactin.' },
            { code: 'PKG-011', name: 'Pre-Marital Screen', goal: 'sexual', testCount: 9, individual_sum: 52000, package_price: 38000, desc: 'Genotype, Blood Group, HIV, Hepatitis B & C, and Syphilis screening for couples.' },
            { code: 'PKG-012', name: 'Complete STI Panel', goal: 'sexual', testCount: 8, individual_sum: 48000, package_price: 35000, desc: 'Comprehensive discrete screening for common sexually transmitted infections.' },
            { code: 'PKG-013', name: 'Liver Health Check', goal: 'chronic', testCount: 4, individual_sum: 28000, package_price: 21500, desc: 'Detailed Liver Function Test (LFT) combined with Hepatitis B and C screening.' },
            { code: 'PKG-014', name: 'Kidney Health Check', goal: 'chronic', testCount: 4, individual_sum: 22000, package_price: 17500, desc: 'Electrolytes, Urea, Creatinine, and complete Urinalysis for renal assessment.' },
            { code: 'PKG-015', name: 'Fatigue & Energy Panel', goal: 'wellness', testCount: 6, individual_sum: 58000, package_price: 46000, desc: 'Investigate chronic tiredness through Vitamin D, B12, Iron Profile, and Thyroid checks.' }
        ];

        // 2. Shared Cart State
        window.STATE = {
            cart: JSON.parse(localStorage.getItem('labrunr_cart') || '[]'),
            saveCart() { localStorage.setItem('labrunr_cart', JSON.stringify(this.cart)); },
            addToCart(pkgCode) { 
                if (this.cart.find(item => item.code === pkgCode)) {
                    window.UTILS.toast("Package is already in your cart", "warning");
                    return;
                }
                const pkgObj = packagesData.find(p => p.code === pkgCode);
                if(pkgObj) {
                    // Normalize package to look like a test in the cart
                    const cartItem = {
                        code: pkgObj.code,
                        name: pkgObj.name,
                        category: 'Health Package',
                        price_min: pkgObj.package_price, 
                        price_max: pkgObj.package_price,
                        isPackage: true
                    };
                    this.cart.push(cartItem); 
                    this.saveCart(); 
                    this.updateCartUI(); 
                    window.UTILS.toast(`${pkgObj.name} added to cart`);
                }
            },
            updateCartUI() {
                const badge = document.getElementById('cartCount');
                if (badge) badge.textContent = `Cart (${this.cart.length})`;
            }
        };

        window.UTILS = {
            toast(message, type = 'success') {
                const t = document.createElement('div');
                t.className = `toast`;
                let icon = `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                if(type === 'warning') {
                    t.style.borderLeftColor = 'var(--warning)';
                    icon = `<svg width="24" height="24" fill="none" stroke="var(--warning)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                }
                t.innerHTML = `<span class='toast-icon'>${icon}</span> <span>${message}</span>`;
                document.body.appendChild(t);
                setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(20px)'; t.style.transition = 'all 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
            }
        };

        const formatNaira = (num) => '₦' + num.toLocaleString('en-NG');

        /* =========================================
           UI LOGIC
        ========================================= */
        let currentGoal = 'all';
        const gridEl = document.getElementById('packagesGrid');
        const emptyState = document.getElementById('emptyState');
        const tabBtns = document.querySelectorAll('.tab-btn');

        function renderGrid() {
            gridEl.innerHTML = '';
            
            const filteredPkgs = currentGoal === 'all' 
                ? packagesData 
                : packagesData.filter(p => p.goal === currentGoal);

            if (filteredPkgs.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            filteredPkgs.forEach(pkg => {
                // Calculate Savings Badge
                let badgeHTML = '';
                if (pkg.individual_sum > pkg.package_price) {
                    const savings = pkg.individual_sum - pkg.package_price;
                    badgeHTML = `
                        <div class="save-badge">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                            Save ${formatNaira(savings)}
                        </div>`;
                }

                const inCart = window.STATE.cart.some(item => item.code === pkg.code);
                const btnClass = inCart ? 'book-btn added' : 'book-btn';
                const btnText = inCart ? 'Added to Cart' : 'Add to Cart';

                // FIXED: Changed <div class="pkg-card"> to <a href="...">
                // FIXED: Added event.preventDefault() to the button
                const cardHTML = `
                    <a href="/package-detail.html?id=${pkg.code}" class="pkg-card">
                        <div class="pkg-header">
                            ${badgeHTML}
                        </div>
                        <h3>${pkg.name}</h3>
                        <p class="pkg-desc">${pkg.desc}</p>
                        
                        <div class="test-count">
                            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                            Includes ${pkg.testCount} Tests
                        </div>
                        
                        <div class="pkg-footer">
                            <div class="price-block">
                                <span class="sum-price">Individual: ${formatNaira(pkg.individual_sum)}</span>
                                <span class="final-price">${formatNaira(pkg.package_price)}</span>
                            </div>
                            <button class="${btnClass}" onclick="event.preventDefault(); handleAddToCart('${pkg.code}', this)">
                                ${btnText}
                            </button>
                        </div>
                    </a>
                `;
                gridEl.innerHTML += cardHTML;
            });
        }
        // Handle Add to Cart Click
        window.handleAddToCart = function(code, btnElement) {
            if(btnElement.classList.contains('added')) {
                // Already in cart, route them to booking
                window.location.href = '/book.html';
                return;
            }
            
            STATE.addToCart(code);
            btnElement.classList.add('added');
            btnElement.textContent = 'Added to Cart';
        };

        // Filter Logic
        tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tabBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentGoal = e.target.getAttribute('data-goal');
                renderGrid();
            });
        });

        window.resetFilters = function() {
            tabBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('[data-goal="all"]').classList.add('active');
            currentGoal = 'all';
            renderGrid();
        };

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            STATE.updateCartUI();
            renderGrid();
        });

    </script>
</body>
</html>
