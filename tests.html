<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Catalogue | LabRunr</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. DESIGN SYSTEM (Premium White-Dominant)
        ========================================= */
        :root {
            --white: #ffffff;
            --bg-body: #fbfdfc; 
            --bg-surface: #ffffff;
            --bg-light-mint: #eef7f5;
            
            --teal-primary: #1a6f61;
            --teal-hover: #135248;
            --mint-accent: #5bc2a8;
            
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            
            --success: #059669;
            --warning: #d97706;
            --warning-bg: #fef3c7;
            
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -3px rgba(26, 111, 97, 0.1);
            
            --font-head: 'Fraunces', serif;
            --font-body: 'Inter', sans-serif;
            
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            
            --container-max: 1320px;
        }

        /* =========================================
           2. RESET & BASE
        ========================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--text-body); background-color: var(--bg-body); line-height: 1.6; -webkit-font-smoothing: antialiased; padding-top: 80px; }
        a { text-decoration: none; color: inherit; transition: all 0.2s; }
        ul { list-style: none; }
        h1, h2, h3, h4 { font-family: var(--font-head); color: var(--text-heading); font-weight: 700; line-height: 1.2; }

        .container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 24px; }
        @media (max-width: 640px) { .container { padding: 0 16px; } }

        /* Navigation */
        .nav-header { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); padding: 16px 0; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: var(--font-head); font-weight: 900; font-size: 1.5rem; color: var(--teal-primary); display: flex; align-items: center; gap: 10px; }
        .logo svg { width: 28px; height: 28px; color: var(--mint-accent); }
        .nav-links { display: flex; gap: 32px; align-items: center; font-weight: 500; }
        .nav-links a.link-item:hover { color: var(--teal-primary); }
        .btn-primary { background: var(--teal-primary); color: var(--white); padding: 12px 24px; border-radius: var(--radius-full); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; transition: 0.2s;}
        .btn-primary:hover { background: var(--teal-hover); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text-heading); padding: 12px 24px; border-radius: var(--radius-full); font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-outline:hover { border-color: var(--teal-primary); color: var(--teal-primary); }

        @media (max-width: 860px) { .nav-links .hide-mobile { display: none; } }

        /* =========================================
           3. TOAST NOTIFICATIONS (UTILS)
        ========================================= */
        .toast {
            position: fixed; bottom: 32px; right: 32px; z-index: 1000;
            background: var(--bg-surface); border-left: 4px solid var(--success);
            box-shadow: var(--shadow-lg); padding: 16px 24px; border-radius: var(--radius-md);
            display: flex; align-items: center; gap: 12px; font-weight: 500;
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .toast-icon { color: var(--success); display: flex; align-items: center; }

        /* =========================================
           4. CATALOGUE LAYOUT
        ========================================= */
        .page-header { padding: 48px 0 32px; border-bottom: 1px solid var(--border-light); background: var(--bg-surface); margin-bottom: 32px;}
        .page-header h1 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 16px; }
        .page-header p { font-size: 1.125rem; color: var(--text-muted); max-width: 600px; }

        .catalogue-wrapper { display: flex; gap: 48px; align-items: flex-start; padding-bottom: 96px; }
        
        /* Sidebar Filter */
        .filter-sidebar { width: 280px; flex-shrink: 0; position: sticky; top: 100px; }
        .filter-group { margin-bottom: 32px; }
        .filter-group h3 { font-family: var(--font-body); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 16px; font-weight: 700;}
        
        .cat-list { display: flex; flex-direction: column; gap: 8px; }
        .cat-btn { background: transparent; border: none; text-align: left; padding: 10px 16px; border-radius: var(--radius-md); font-size: 0.95rem; font-family: var(--font-body); color: var(--text-body); cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;}
        .cat-btn:hover { background: var(--bg-light-mint); color: var(--teal-primary); }
        .cat-btn.active { background: var(--teal-primary); color: var(--white); font-weight: 600; box-shadow: var(--shadow-sm);}
        .cat-btn .count { font-size: 0.8rem; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 10px; }
        .cat-btn.active .count { background: rgba(255,255,255,0.2); }

        @media (max-width: 900px) {
            .catalogue-wrapper { flex-direction: column; gap: 24px; }
            .filter-sidebar { width: 100%; position: relative; top: 0; }
            .cat-list { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
            .cat-list::-webkit-scrollbar { display: none; }
            .cat-btn { flex-shrink: 0; background: var(--bg-surface); border: 1px solid var(--border-light); }
        }

        /* Main Grid Area */
        .main-content { flex-grow: 1; min-width: 0; }
        
        /* Search & Sort Bar */
        .controls-bar { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .search-box { flex-grow: 1; position: relative; min-width: 260px; }
        .search-box svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-muted); }
        .search-box input { width: 100%; padding: 16px 16px 16px 48px; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: 1rem; font-family: var(--font-body); outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: var(--bg-surface);}
        .search-box input:focus { border-color: var(--teal-primary); box-shadow: 0 0 0 4px rgba(26, 111, 97, 0.1); }
        
        .sort-box select { padding: 16px 40px 16px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: 0.95rem; font-family: var(--font-body); outline: none; background: var(--bg-surface); cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 12px auto;}
        .sort-box select:focus { border-color: var(--teal-primary); }

        /* Test Grid */
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        
        /* Test Card */
        .test-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; transition: all 0.3s; position: relative; overflow: hidden; }
        .test-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--teal-primary); opacity: 0; transition: 0.3s; }
        .test-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--border-light); }
        .test-card:hover::before { opacity: 1; }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 8px;}
        .cat-badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--teal-primary); font-weight: 700; background: var(--bg-light-mint); padding: 4px 8px; border-radius: 4px; }
        
        .test-card h3 { font-size: 1.25rem; margin-bottom: 16px; line-height: 1.3; }
        
        .card-meta { display: flex; gap: 16px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; font-weight: 500;}
        .meta-item { display: flex; align-items: center; gap: 6px; }
        .meta-item svg { width: 16px; height: 16px; }
        
        .fasting-warn { display: inline-flex; align-items: center; gap: 6px; background: var(--warning-bg); color: var(--warning); padding: 4px 10px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 600; margin-bottom: 16px; align-self: flex-start;}
        
        .card-footer { margin-top: auto; border-top: 1px solid var(--border-light); padding-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .price-range { font-family: var(--font-head); font-weight: 700; font-size: 1.15rem; color: var(--text-heading); }
        .price-label { font-size: 0.75rem; color: var(--text-muted); display: block; font-family: var(--font-body); font-weight: 500;}
        
        .add-btn { background: var(--bg-surface); border: 1px solid var(--border-light); color: var(--text-heading); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .test-card:hover .add-btn { border-color: var(--teal-primary); color: var(--teal-primary); }
        .add-btn:hover { background: var(--teal-primary) !important; color: white !important; }
        .add-btn.added { background: var(--success) !important; border-color: var(--success); color: white !important; }

        /* Empty State */
        .empty-state { text-align: center; padding: 64px 24px; background: var(--bg-surface); border: 1px dashed var(--border-light); border-radius: var(--radius-md); display: none; }
        .empty-state svg { width: 48px; height: 48px; color: var(--border-light); margin-bottom: 16px; }
        .empty-state h3 { font-size: 1.25rem; margin-bottom: 8px; }
        .empty-state p { color: var(--text-muted); margin-bottom: 24px; }

        /* Load More */
        .load-more-container { text-align: center; margin-top: 48px; border-top: 1px solid var(--border-light); padding-top: 32px;}
        .load-count { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; font-weight: 500;}

        /* Skeletons */
        .skeleton { background: #f1f5f9; position: relative; overflow: hidden; border-color: transparent;}
        .skeleton::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-100%); background-image: linear-gradient(90deg, rgba(255, 255, 255, 0) 0, rgba(255, 255, 255, 0.4) 20%, rgba(255, 255, 255, 0.6) 60%, rgba(255, 255, 255, 0) 100%); animation: shimmer 2s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .skel-text { height: 20px; background: #e2e8f0; border-radius: 4px; margin-bottom: 12px; }
        .skel-text.short { width: 40%; }
        .skel-badge { width: 60px; height: 24px; background: #e2e8f0; border-radius: 4px; }
    </style>
</head>
<body>

    <header class="nav-header" id="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4zm-7 18c0-4.42 3.58-8 8-8s8 3.58 8 8H5z"/></svg>
                <span>LabRunr</span>
            </a>
            <nav class="nav-links">
                <a href="/tests.html" class="link-item hide-mobile" style="color: var(--teal-primary); font-weight: 600;">Tests</a>
                <a href="/packages.html" class="link-item hide-mobile">Packages</a>
                <a href="/auth-login.html" class="link-item">Sign In</a>
                
                <a href="/book.html" class="btn-primary" id="navCartBtn" style="padding: 10px 20px; font-size: 0.95rem;">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span id="cartCount">Cart (0)</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>Test Catalogue</h1>
            <p>Browse over 150 individual diagnostic tests available for home collection. Transparent pricing across our accredited lab network.</p>
        </div>
    </div>

    <main class="container catalogue-wrapper">
        
        <aside class="filter-sidebar">
            <div class="filter-group">
                <h3>Categories</h3>
                <div class="cat-list" id="category-list">
                    <button class="cat-btn active" data-category="all">All Tests <span class="count" id="count-all">0</span></button>
                    <button class="cat-btn" data-category="wellness">Wellness & Prevention <span class="count">0</span></button>
                    <button class="cat-btn" data-category="diabetes">Diabetes & Metabolic <span class="count">0</span></button>
                    <button class="cat-btn" data-category="heart">Heart Health <span class="count">0</span></button>
                    <button class="cat-btn" data-category="women">Women's Health <span class="count">0</span></button>
                    <button class="cat-btn" data-category="men">Men's Health <span class="count">0</span></button>
                    <button class="cat-btn" data-category="kidney">Kidney & Liver <span class="count">0</span></button>
                    <button class="cat-btn" data-category="infectious">Infectious Disease <span class="count">0</span></button>
                </div>
            </div>
        </aside>

        <section class="main-content">
            
            <div class="controls-bar">
                <div class="search-box">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    <input type="text" id="searchInput" placeholder="Search for a test (e.g., HbA1c, Full Blood Count)...">
                </div>
                <div class="sort-box">
                    <select id="sortSelect">
                        <option value="popular">Most Popular</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="tat">Fastest Results (TAT)</option>
                    </select>
                </div>
            </div>

            <div class="test-grid" id="testGrid">
                </div>

            <div class="empty-state" id="emptyState">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607zM10.5 7.5v6m3-3h-6" /></svg>
                <h3>No tests found</h3>
                <p>We couldn't find any tests matching your search criteria.</p>
                <button class="btn-outline" onclick="clearFilters()">Clear Filters</button>
            </div>

            <div class="load-more-container" id="loadMoreContainer">
                <span class="load-count" id="loadCountText">Showing 12 of 24 tests</span>
                <button class="btn-outline" id="loadMoreBtn">Load More Tests</button>
            </div>

        </section>
    </main>

    <script>
        /* =========================================
           DATA & LOGIC
        ========================================= */

        // 1. Hardcoded Dataset (24 Tests)
        const testsData = [
            { code: 'LBR-001', name: 'HbA1c (Glycated Haemoglobin)', category: 'diabetes', sampleType: 'Blood', fasting: false, price_min: 7500, price_max: 14000, tat: 24, pop: 100 },
            { code: 'LBR-002', name: 'Full Blood Count (FBC)', category: 'wellness', sampleType: 'Blood', fasting: false, price_min: 5000, price_max: 9500, tat: 12, pop: 95 },
            { code: 'LBR-003', name: 'Lipid Profile', category: 'heart', sampleType: 'Blood', fasting: true, price_min: 8000, price_max: 15000, tat: 24, pop: 90 },
            { code: 'LBR-004', name: 'Comprehensive Metabolic Panel', category: 'wellness', sampleType: 'Blood', fasting: true, price_min: 12000, price_max: 22000, tat: 24, pop: 85 },
            { code: 'LBR-005', name: 'Thyroid Stimulating Hormone (TSH)', category: 'women', sampleType: 'Blood', fasting: false, price_min: 6500, price_max: 12000, tat: 24, pop: 80 },
            { code: 'LBR-006', name: 'Prostate Specific Antigen (PSA)', category: 'men', sampleType: 'Blood', fasting: false, price_min: 9000, price_max: 16000, tat: 24, pop: 75 },
            { code: 'LBR-007', name: 'Liver Function Test (LFT)', category: 'kidney', sampleType: 'Blood', fasting: false, price_min: 7500, price_max: 13500, tat: 24, pop: 70 },
            { code: 'LBR-008', name: 'Kidney Function Test (E&U)', category: 'kidney', sampleType: 'Blood', fasting: false, price_min: 7000, price_max: 12500, tat: 24, pop: 68 },
            { code: 'LBR-009', name: 'Fasting Blood Sugar (FBS)', category: 'diabetes', sampleType: 'Blood', fasting: true, price_min: 3000, price_max: 6000, tat: 12, pop: 92 },
            { code: 'LBR-010', name: 'Urinalysis', category: 'wellness', sampleType: 'Urine', fasting: false, price_min: 2500, price_max: 5000, tat: 12, pop: 88 },
            { code: 'LBR-011', name: 'Hepatitis B Surface Antigen', category: 'infectious', sampleType: 'Blood', fasting: false, price_min: 5500, price_max: 10000, tat: 24, pop: 65 },
            { code: 'LBR-012', name: 'Hepatitis C Antibody', category: 'infectious', sampleType: 'Blood', fasting: false, price_min: 6000, price_max: 11000, tat: 24, pop: 60 },
            { code: 'LBR-013', name: 'HIV 1 & 2 Screening', category: 'infectious', sampleType: 'Blood', fasting: false, price_min: 4500, price_max: 8000, tat: 12, pop: 72 },
            { code: 'LBR-014', name: 'Vitamin D (25-OH)', category: 'wellness', sampleType: 'Blood', fasting: false, price_min: 15000, price_max: 28000, tat: 48, pop: 55 },
            { code: 'LBR-015', name: 'Vitamin B12', category: 'wellness', sampleType: 'Blood', fasting: true, price_min: 12000, price_max: 21000, tat: 48, pop: 50 },
            { code: 'LBR-016', name: 'Iron Profile', category: 'women', sampleType: 'Blood', fasting: true, price_min: 9500, price_max: 17000, tat: 24, pop: 62 },
            { code: 'LBR-017', name: 'Testosterone (Total)', category: 'men', sampleType: 'Blood', fasting: false, price_min: 8500, price_max: 15500, tat: 24, pop: 58 },
            { code: 'LBR-018', name: 'Follicle Stimulating Hormone (FSH)', category: 'women', sampleType: 'Blood', fasting: false, price_min: 7500, price_max: 14000, tat: 24, pop: 53 },
            { code: 'LBR-019', name: 'Luteinizing Hormone (LH)', category: 'women', sampleType: 'Blood', fasting: false, price_min: 7500, price_max: 14000, tat: 24, pop: 51 },
            { code: 'LBR-020', name: 'High Sensitivity CRP (hs-CRP)', category: 'heart', sampleType: 'Blood', fasting: false, price_min: 11000, price_max: 19000, tat: 24, pop: 45 },
            { code: 'LBR-021', name: 'Malaria Parasite (MP)', category: 'infectious', sampleType: 'Blood', fasting: false, price_min: 3000, price_max: 6500, tat: 12, pop: 89 },
            { code: 'LBR-022', name: 'Widal Test (Typhoid)', category: 'infectious', sampleType: 'Blood', fasting: false, price_min: 3500, price_max: 7000, tat: 12, pop: 82 },
            { code: 'LBR-023', name: 'Uric Acid', category: 'kidney', sampleType: 'Blood', fasting: false, price_min: 5000, price_max: 9000, tat: 24, pop: 48 },
            { code: 'LBR-024', name: 'Syphilis (VDRL)', category: 'infectious', sampleType: 'Blood', fasting: false, price_min: 4000, price_max: 7500, tat: 24, pop: 40 }
        ];

        /* =========================================
           STATE MANAGEMENT (From shared/state.js spec)
        ========================================= */
        window.STATE = {
            cart: JSON.parse(localStorage.getItem('labrunr_cart') || '[]'),
            saveCart() { 
                localStorage.setItem('labrunr_cart', JSON.stringify(this.cart)); 
            },
            addToCart(testCode) { 
                // Prevent duplicates
                if (this.cart.find(item => item.code === testCode)) {
                    UTILS.toast("Item is already in your cart", "warning");
                    return;
                }
                
                const testObj = testsData.find(t => t.code === testCode);
                if(testObj) {
                    this.cart.push(testObj); 
                    this.saveCart(); 
                    this.updateCartUI(); 
                    UTILS.toast(`Added ${testObj.name} to cart`);
                }
            },
            updateCartUI() {
                const badge = document.getElementById('cartCount');
                if (badge) {
                    badge.textContent = `Cart (${this.cart.length})`;
                }
            }
        };

        window.UTILS = {
            toast(message, type = 'success') {
                const t = document.createElement('div');
                t.className = `toast`;
                
                let icon = `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                if(type === 'warning') {
                    t.style.borderLeftColor = 'var(--warning)';
                    icon = `<svg width="24" height="24" fill="none" stroke="var(--warning)" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                }

                t.innerHTML = `<span class='toast-icon'>${icon}</span> <span>${message}</span>`;
                document.body.appendChild(t);
                
                setTimeout(() => {
                    t.style.opacity = '0';
                    t.style.transform = 'translateY(20px)';
                    t.style.transition = 'all 0.3s';
                    setTimeout(() => t.remove(), 300);
                }, 3000);
            }
        };

        // 2. View State Variables
        let filteredTests = [...testsData];
        let visibleCount = 12;
        let currentCategory = 'all';
        let searchQuery = '';
        let currentSort = 'popular';

        // 3. DOM Elements
        const gridEl = document.getElementById('testGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const catButtons = document.querySelectorAll('.cat-btn');
        const emptyState = document.getElementById('emptyState');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const loadCountText = document.getElementById('loadCountText');
        const loadMoreBtn = document.getElementById('loadMoreBtn');

        // Format Currency
        const formatNaira = (num) => '₦' + num.toLocaleString('en-NG');

        // 4. Initial Render (Skeletons)
        function renderSkeletons() {
            gridEl.innerHTML = '';
            for(let i=0; i<6; i++) {
                gridEl.innerHTML += `
                    <div class="test-card skeleton">
                        <div class="skel-badge mb-3"></div>
                        <div class="skel-text"></div>
                        <div class="skel-text short"></div>
                        <div style="margin-top: 40px;">
                            <div class="skel-text short"></div>
                        </div>
                    </div>
                `;
            }
        }

        // 5. Render Real Data
        function renderGrid() {
            gridEl.innerHTML = '';
            
            if (filteredTests.length === 0) {
                emptyState.style.display = 'block';
                loadMoreContainer.style.display = 'none';
                return;
            } else {
                emptyState.style.display = 'none';
                loadMoreContainer.style.display = 'block';
            }

            const testsToShow = filteredTests.slice(0, visibleCount);
            
            testsToShow.forEach(test => {
                // Category text mapping
                const catMap = { wellness: 'Wellness', diabetes: 'Diabetes', heart: 'Heart', women: 'Women\'s', men: 'Men\'s', kidney: 'Kidney/Liver', infectious: 'Infectious' };
                const displayCat = catMap[test.category] || test.category;

                const fastingHTML = test.fasting 
                    ? `<div class="fasting-warn"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg> Fasting Required</div>` 
                    : '';

                // Check if already in cart to style button
                const inCart = window.STATE && window.STATE.cart.some(item => item.code === test.code);
                const btnClass = inCart ? 'add-btn added' : 'add-btn';
                const btnIcon = inCart 
                    ? `<svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`
                    : `<svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>`;

                // FIXED LINK HERE: Points to the single template page
                const cardHTML = `
                    <a href="/test-detail.html?id=${test.code}" class="test-card">
                        <div class="card-header">
                            <span class="cat-badge">${displayCat}</span>
                        </div>
                        <h3>${test.name}</h3>
                        
                        ${fastingHTML}
                        
                        <div class="card-meta">
                            <div class="meta-item">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                                ${test.sampleType}
                            </div>
                            <div class="meta-item">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                ${test.tat} hrs TAT
                            </div>
                        </div>
                        
                        <div class="card-footer">
                            <div>
                                <span class="price-label">Price Range (Across Labs)</span>
                                <div class="price-range">${formatNaira(test.price_min)} - ${formatNaira(test.price_max)}</div>
                            </div>
                            <button class="${btnClass}" aria-label="Book Test" onclick="event.preventDefault(); window.handleAddToCart('${test.code}', this);">
                                ${btnIcon}
                            </button>
                        </div>
                    </a>
                `;
                gridEl.innerHTML += cardHTML;
            });

            // Update Counter Text
            loadCountText.textContent = `Showing ${testsToShow.length} of ${filteredTests.length} tests`;
            if (visibleCount >= filteredTests.length) {
                loadMoreBtn.style.display = 'none';
            } else {
                loadMoreBtn.style.display = 'inline-block';
            }
        }

        // Global Add To Cart handler for the inline onclick event
        window.handleAddToCart = function(code, buttonElement) {
            STATE.addToCart(code);
            // Visually update the button immediately
            buttonElement.classList.add('added');
            buttonElement.innerHTML = `<svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`;
        };

        // 6. Apply Filters & Sort
        function applyFilters() {
            filteredTests = testsData.filter(test => {
                const matchesSearch = test.name.toLowerCase().includes(searchQuery) || test.code.toLowerCase().includes(searchQuery);
                const matchesCat = currentCategory === 'all' || test.category === currentCategory;
                return matchesSearch && matchesCat;
            });

            // Sorting logic
            if (currentSort === 'price-low') {
                filteredTests.sort((a, b) => a.price_min - b.price_min);
            } else if (currentSort === 'price-high') {
                filteredTests.sort((a, b) => b.price_min - a.price_min);
            } else if (currentSort === 'tat') {
                filteredTests.sort((a, b) => a.tat - b.tat);
            } else {
                // Popularity (default)
                filteredTests.sort((a, b) => b.pop - a.pop);
            }

            visibleCount = 12; // Reset pagination on new filter
            renderGrid();
        }

        function clearFilters() {
            searchInput.value = '';
            searchQuery = '';
            currentCategory = 'all';
            currentSort = 'popular';
            sortSelect.value = 'popular';
            
            catButtons.forEach(btn => btn.classList.remove('active'));
            document.querySelector('[data-category="all"]').classList.add('active');
            
            applyFilters();
        }

        // 7. Event Listeners
        searchInput.addEventListener('keyup', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            applyFilters();
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            applyFilters();
        });

        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                catButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-category');
                applyFilters();
            });
        });

        loadMoreBtn.addEventListener('click', () => {
            visibleCount += 12;
            renderGrid();
        });

        // Compute Category Counts dynamically
        function initCategoryCounts() {
            document.getElementById('count-all').textContent = testsData.length;
            catButtons.forEach(btn => {
                const cat = btn.getAttribute('data-category');
                if (cat !== 'all') {
                    const count = testsData.filter(t => t.category === cat).length;
                    const countSpan = btn.querySelector('.count');
                    if (countSpan) countSpan.textContent = count;
                }
            });
        }

        // 8. Initialization
        window.addEventListener('DOMContentLoaded', () => {
            STATE.updateCartUI(); // Load existing cart count on page load
            initCategoryCounts();
            renderSkeletons();
            setTimeout(() => {
                applyFilters(); // Renders actual data after 500ms
            }, 500);
        });

    </script>
</body>
</html>
